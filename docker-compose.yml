services:

  postgres-db:
    image: postgres:15-alpine
    container_name: financial-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data_net
      - simulation_net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres-db
    networks:
      - data_net
      - simulation_net
    restart: unless-stopped

  simulations-seeder:
    profiles:
      - seed
    build:
      context: .
      dockerfile: src/simulations/Dockerfile.seeder
    container_name: simulations-seeder
    depends_on:
      - postgres-db
    environment:
      - BANK_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/bank_db
      - INVEST_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/invest_db
      - RUBLE_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/digital_db
    env_file:
      - .env
    networks:
      - simulation_net

  bank-worker:
    build:
      context: .
      dockerfile: src/simulations/workers/bank_eod/Dockerfile
    container_name: bank-worker
    depends_on:
      - postgres-db
    environment:
      - BANK_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/bank_db
      - TZ=Europe/Moscow
    env_file:
      - .env
    networks:
      - simulation_net
    restart: unless-stopped

  invest-worker:
    build:
      context: .
      dockerfile: src/simulations/workers/invest_eod/Dockerfile
    container_name: invest-worker
    depends_on:
      - postgres-db
    environment:
      - INVEST_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/invest_db
      - TZ=Europe/Moscow
    env_file:
      - .env
    networks:
      - simulation_net
    restart: unless-stopped

  digital-worker:
    build:
      context: .
      dockerfile: src/simulations/workers/digital_eod/Dockerfile
    container_name: digital-worker
    depends_on:
      postgres-db:
        condition: service_started
    environment:
      - RUBLE_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/digital_db
      - TZ=Europe/Moscow
    env_file:
      - .env
    networks:
      - simulation_net
    restart: unless-stopped

  simulation-api:
    build:
      context: .
      dockerfile: src/simulations/api/Dockerfile
    container_name: simulation-api
    depends_on:
      - postgres-db
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - BANK_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/bank_db
      - INVEST_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/invest_db
      - RUBLE_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/digital_db
    env_file:
      - .env
    networks:
      - simulation_net
    restart: unless-stopped

  minio:
    image: elestio/minio:latest
    container_name: minio-server
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
      - MINIO_KMS_SECRET_KEY=${MINIO_KMS_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - data_net
    restart: unless-stopped
    
  redis:
    image: redis:7-alpine
    container_name: redis-server
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    restart: unless-stopped

  admin-server:
    build:
      context: .
      dockerfile: src/admin_server/fastapi/Dockerfile
    container_name: admin-server
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - MINIO_URL=minio:9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres-db
      - GOOGLE_APPLICATION_CREDENTIALS=/app/data/gcp-service-account.json
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
      - MINIO_SSE_ENABLED=${MINIO_SSE_ENABLED:-false}
      - CHROMA_ENVELOPE_ENCRYPTION_ENABLED=${CHROMA_ENVELOPE_ENCRYPTION_ENABLED:-true}
      - REQUIRE_MTLS=${REQUIRE_MTLS:-false}
      - ALLOWED_MTLS_SUBJECTS=${ALLOWED_MTLS_SUBJECTS:-}
      - ALLOWED_MTLS_ISSUERS=${ALLOWED_MTLS_ISSUERS:-}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - REDIS_SSL=${REDIS_SSL:-false}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-prefer}
    volumes:
      - ./data:/app/data:ro
    env_file:
      - .env
    networks:
      - edge_net
      - backend_net
      - data_net
    restart: unless-stopped
    depends_on:
      - minio
      - redis
      - postgres-db

  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: chromadb-server
    environment:
      - CHROMA_SERVER_AUTH_PROVIDER=chromadb.auth.token.TokenAuthServerProvider
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=chromadb.auth.token.TokenConfigServerAuthCredentialsProvider
      - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_AUTH_TOKEN}
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - data_net
    restart: unless-stopped
    
  vector-worker:
    build:
      context: .
      dockerfile: src/admin_server/vectors/Dockerfile
    container_name: vector-worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_URL=minio:9000
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_AUTH_TOKEN=${CHROMA_AUTH_TOKEN}
      - DB_HOST=postgres-db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/data/gcp-service-account.json
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
      - MINIO_SSE_C_KEY=${MINIO_SSE_C_KEY}
      - CHROMA_ENVELOPE_ENCRYPTION_ENABLED=${CHROMA_ENVELOPE_ENCRYPTION_ENABLED:-true}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - REDIS_SSL=${REDIS_SSL:-false}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-prefer}
    volumes:
      - ./data:/app/data:ro
    env_file:
      - .env
    networks:
      - backend_net
      - data_net
    restart: unless-stopped
    depends_on:
      - redis
      - minio
      - chromadb

  caddy:
    image: caddy:2-alpine
    container_name: caddy-server
    restart: unless-stopped
    depends_on:
      - admin-server
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_CLIENT_AUTH_MODE=${CADDY_CLIENT_AUTH_MODE:-request}
    volumes:
      - ./src/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge_net

networks:
  edge_net:
    driver: bridge
  backend_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true
  simulation_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  caddy_data:
  caddy_config:
  minio_data:
  redis_data:
  chroma_data:
