services:
  s3-minio:
    image: quay.io/minio/minio:latest
    container_name: s3-storage-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  vector-db:
    image: chromadb/chroma:latest
    container_name: chroma-vector-db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_gold_data:/chroma/chroma
    restart: unless-stopped

  elt:
    build:
      context: .
      dockerfile: src/elt/Dockerfile
    container_name: elt
    depends_on:
      - s3-minio
      - postgres-db
    environment:
      - MINIO_ENDPOINT=s3-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/data/gcp-service-account.json
      - CHROMA_HOST=vector-db
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  postgres-db:
    image: postgres:15-alpine
    container_name: financial-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres-db
    restart: unless-stopped

  mcp-rag:
    build:
      context: .
      dockerfile: src/mcp_servers/rag/Dockerfile
    container_name: mcp-rag-server
    ports:
      - "0.0.0.0:8001:8001"
    environment:
      - CHROMA_HOST=vector-db
    env_file:
      - .env
    depends_on:
      - vector-db
    restart: unless-stopped

volumes:
  minio_data:
  chroma_gold_data:
  postgres_data:
  pgadmin_data:
