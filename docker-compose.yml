services:

  root-ca:
    build:
      context: .
      dockerfile: src/pki/Dockerfile.ca
    container_name: root-ca-service
    environment:
      - ROOT_CA_PASSPHRASE=${ROOT_CA_PASSPHRASE:-}
      - ROOT_CA_DATA_DIR=/data/ca
      - SHARED_CERTS_DIR=/shared_certs
      - CA_PUBLIC_DIR=/export/ca_public
      - ADMIN_CERTS_DIR=/export/admin_certs
      - BANK_CERTS_DIR=/export/bank_certs
      - ADMIN_CLIENT_CERTS_DIR=/export/admin_client_certs
      - ISOLATE_ADMIN_CLIENT_KEY=true
      - FORCE_REGENERATE=${FORCE_REGENERATE:-false}
      - STRICT_SECURITY=true
    volumes:
      - root_ca_data:/data/ca
      - certs_data:/shared_certs
      - ca_public:/export/ca_public
      - admin_certs:/export/admin_certs
      - bank_certs:/export/bank_certs
      - admin_client_certs:/export/admin_client_certs
    networks:
      - pki_net
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
          pids: 50
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 50

  postgres-db:
    image: postgres:15-alpine
    container_name: financial-postgres
    depends_on:
      root-ca:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      sh -c "mkdir -p /tmp/pg_certs && cp /certs/postgres.key /tmp/pg_certs/postgres.key && chmod 600 /tmp/pg_certs/postgres.key && chown postgres:postgres /tmp/pg_certs/postgres.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/postgres.crt -c ssl_key_file=/tmp/pg_certs/postgres.key -c ssl_ca_file=/certs/ca.crt"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/simulations/db/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro
      - certs_data:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - data_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
          pids: 200
    mem_limit: 1024m
    cpus: 2.0
    pids_limit: 200

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: pgadmin4_container
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ca_public:/certs:ro
    depends_on:
      postgres-db:
        condition: service_healthy
      root-ca:
        condition: service_completed_successfully
    networks:
      - data_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

  simulations-seeder:
    profiles:
      - seed
    build:
      context: .
      dockerfile: src/simulations/Dockerfile.seeder
    container_name: simulations-seeder
    depends_on:
      postgres-db:
        condition: service_healthy
      root-ca:
        condition: service_completed_successfully
    environment:
      - BANK_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/bank_db
      - INVEST_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/invest_db
      - RUBLE_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/digital_db
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-require}
      - SSL_CERT_FILE=/certs/ca.crt
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
    volumes:
      - ca_public:/certs:ro
    networks:
      - simulation_net
      - data_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

  bank-worker:
    build:
      context: .
      dockerfile: src/simulations/workers/bank_eod/Dockerfile
    container_name: bank-worker
    depends_on:
      postgres-db:
        condition: service_healthy
      root-ca:
        condition: service_completed_successfully
    environment:
      - BANK_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/bank_db
      - TZ=Europe/Moscow
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-require}
      - SSL_CERT_FILE=/certs/ca.crt
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
    volumes:
      - bank_certs:/certs:ro
    networks:
      - simulation_net
      - data_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

  invest-worker:
    build:
      context: .
      dockerfile: src/simulations/workers/invest_eod/Dockerfile
    container_name: invest-worker
    depends_on:
      postgres-db:
        condition: service_healthy
      root-ca:
        condition: service_completed_successfully
    environment:
      - INVEST_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/invest_db
      - TZ=Europe/Moscow
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-require}
      - SSL_CERT_FILE=/certs/ca.crt
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
    volumes:
      - ca_public:/certs:ro
    networks:
      - simulation_net
      - data_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

  digital-worker:
    build:
      context: .
      dockerfile: src/simulations/workers/digital_eod/Dockerfile
    container_name: digital-worker
    depends_on:
      postgres-db:
        condition: service_healthy
      root-ca:
        condition: service_completed_successfully
    environment:
      - RUBLE_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/digital_db
      - TZ=Europe/Moscow
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-require}
      - SSL_CERT_FILE=/certs/ca.crt
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
    volumes:
      - ca_public:/certs:ro
    networks:
      - simulation_net
      - data_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

  simulation-api:
    build:
      context: .
      dockerfile: src/simulations/api/Dockerfile
    container_name: simulation-api
    depends_on:
      postgres-db:
        condition: service_healthy
      root-ca:
        condition: service_completed_successfully
    environment:
      - STRICT_SECURITY=true
      - BANK_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/bank_db
      - INVEST_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/invest_db
      - RUBLE_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/digital_db
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-require}
      - SSL_CERT_FILE=/certs/ca.crt
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
      - AGENT_BANK_BOOTSTRAP_TOKEN=${AGENT_BANK_BOOTSTRAP_TOKEN}
      - AGENT_INVEST_BOOTSTRAP_TOKEN=${AGENT_INVEST_BOOTSTRAP_TOKEN}
      - AGENT_DIGITAL_BOOTSTRAP_TOKEN=${AGENT_DIGITAL_BOOTSTRAP_TOKEN}
      - AGENT_MAIN_BOOTSTRAP_TOKEN=${AGENT_MAIN_BOOTSTRAP_TOKEN}
      - ORACLE_BOOTSTRAP_TOKEN=${ORACLE_BOOTSTRAP_TOKEN}
      - AGENT_ORACLE_BOOTSTRAP_TOKEN=${AGENT_ORACLE_BOOTSTRAP_TOKEN}
      - REQUIRE_ENCLAVE_SIGNATURE=${REQUIRE_ENCLAVE_SIGNATURE:-true}
    volumes:
      - bank_certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - simulation_net
      - data_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

  minio:
    image: elestio/minio:latest
    container_name: minio-server
    depends_on:
      root-ca:
        condition: service_completed_successfully
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
      - MINIO_KMS_SECRET_KEY=${MINIO_KMS_SECRET_KEY}
    volumes:
      - minio_data:/data
      - certs_data:/certs:ro
    command: server /data --certs-dir /certs/minio --console-address ":9001"
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 150
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 150
    
  redis:
    image: redis:7-alpine
    container_name: redis-server
    depends_on:
      root-ca:
        condition: service_completed_successfully
    command: >
      redis-server 
      --tls-port 6379 
      --port 0 
      --tls-cert-file /certs/redis.crt 
      --tls-key-file /certs/redis.key 
      --tls-ca-cert-file /certs/ca.crt 
      --tls-auth-clients no 
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - certs_data:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /certs/ca.crt -a $$REDIS_PASSWORD ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - admin_backend_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

  admin-server:
    build:
      context: .
      dockerfile: src/admin_server/fastapi/Dockerfile
    container_name: admin-server
    depends_on:
      root-ca:
        condition: service_completed_successfully
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - STRICT_SECURITY=true
      - MINIO_URL=minio:9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres-db
      - GOOGLE_APPLICATION_CREDENTIALS=/app/data/gcp-service-account.json
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
      - JWT_PRIVATE_KEY_PATH=${JWT_PRIVATE_KEY_PATH:-/certs/admin_server.key}
      - JWT_PUBLIC_KEY_PATH=${JWT_PUBLIC_KEY_PATH:-/certs/admin_server.crt}
      - MINIO_SSE_ENABLED=${MINIO_SSE_ENABLED:-true}
      - CHROMA_ENVELOPE_ENCRYPTION_ENABLED=${CHROMA_ENVELOPE_ENCRYPTION_ENABLED:-true}
      - REQUIRE_MTLS=${REQUIRE_MTLS:-true}
      - ALLOWED_MTLS_SUBJECTS=${ALLOWED_MTLS_SUBJECTS:-}
      - ALLOWED_MTLS_ISSUERS=${ALLOWED_MTLS_ISSUERS:-}
      - MINIO_SECURE=${MINIO_SECURE:-true}
      - REDIS_SSL=${REDIS_SSL:-true}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-require}
      - SSL_CERT_FILE=/certs/ca.crt
      - REDIS_SSL_CA_CERTS=/certs/ca.crt
    volumes:
      - ./data:/app/data:ro
      - admin_certs:/certs:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - admin_backend_net
      - data_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
          pids: 150
    mem_limit: 1024m
    cpus: 1.5
    pids_limit: 150

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: chromadb-server
    environment:
      - CHROMA_SERVER_AUTHN_PROVIDER=chromadb.auth.token_authn.TokenAuthenticationServerProvider
      - CHROMA_SERVER_AUTHN_CREDENTIALS=${CHROMA_AUTH_TOKEN}
      - CHROMA_AUTH_TOKEN_TRANSPORT_HEADER=Authorization
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - data_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
          pids: 150
    mem_limit: 1024m
    cpus: 1.5
    pids_limit: 150

  vector-worker:
    build:
      context: .
      dockerfile: src/admin_server/vectors/Dockerfile
    container_name: vector-worker
    depends_on:
      root-ca:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    environment:
      - STRICT_SECURITY=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_URL=minio:9000
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_AUTH_TOKEN=${CHROMA_AUTH_TOKEN}
      - DB_HOST=postgres-db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/data/gcp-service-account.json
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
      - MINIO_SSE_C_KEY=${MINIO_SSE_C_KEY:-}
      - CHROMA_ENVELOPE_ENCRYPTION_ENABLED=${CHROMA_ENVELOPE_ENCRYPTION_ENABLED:-true}
      - MINIO_SECURE=${MINIO_SECURE:-true}
      - REDIS_SSL=${REDIS_SSL:-true}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-require}
      - SSL_CERT_FILE=/certs/ca.crt
      - REDIS_SSL_CA_CERTS=/certs/ca.crt
    volumes:
      - ./data:/app/data:ro
      - ca_public:/certs:ro
    env_file:
      - .env
    networks:
      - admin_backend_net
      - data_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 100
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

  caddy:
    image: caddy:2-alpine
    container_name: caddy-server
    restart: unless-stopped
    depends_on:
      root-ca:
        condition: service_completed_successfully
      admin-server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_CLIENT_AUTH_MODE=${CADDY_CLIENT_AUTH_MODE:-require_and_verify}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:-admin.fin-ai-agent.ru}
      - ADMIN_LOCAL_DOMAIN=${ADMIN_LOCAL_DOMAIN:-admin.fin-ai-agent.local}
    volumes:
      - ./src/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ca_public:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      edge_net:
        aliases:
          - caddy
      admin_backend_net:
        aliases:
          - caddy-backend
          - admin-server.internal
          - simulation-api.internal
          - bank-service.internal
      simulation_net:
        aliases:
          - caddy-sim
          - simulation-api.internal
          - bank-service.internal
          - admin-server.internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
          pids: 100
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100

# -----------------------------------------------------------------------------
# СЕТЕВАЯ МИКРОСЕГМЕНТАЦИЯ И БЕЗОПАСНОСТЬ (Defense-in-Depth / Zero-Trust)
# 1. pki_net:        Изолированная подсеть Root CA (internal: true, нет доступа в интернет).
# 2. edge_net:       Публичный контур ingress (Caddy обратный прокси с TLS 1.3 и mTLS).
# 3. admin_backend_net:   Внутренняя сеть сервисов управления (Admin Server, Vector Worker, Redis).
# 4. data_net:      Изолированная сеть хранения (PostgreSQL, MinIO, ChromaDB) с internal: true
#                   (запрещен любой прямой доступ в/из внешней сети Интернет).
# 5. simulation_net: Изолированный контур банковских симуляций (API, воркеры EOD, смарт-контракты).
# 
# Шифрование данных в транзите (In-Transit Encryption):
# Для боевого контура переключите переменные окружения:
#   REQUIRE_MTLS=true, MINIO_SECURE=true, REDIS_SSL=true, POSTGRES_SSLMODE=require
# При этом данные в покое (Data at Rest) защищены конвертным шифрованием AES-256-GCM.
# -----------------------------------------------------------------------------
networks:
  pki_net:
    driver: bridge
    internal: true
  edge_net:
    driver: bridge
  admin_backend_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true
  simulation_net:
    driver: bridge

volumes:
  root_ca_data:
  certs_data:
  ca_public:
  admin_certs:
  bank_certs:
  admin_client_certs:
  postgres_data:
  pgadmin_data:
  caddy_data:
  caddy_config:
  minio_data:
  redis_data:
  chroma_data:
